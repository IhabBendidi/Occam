[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "occam"
version = "0.1.0"
description = "Occam - a masked autoencoder for single-cell transcriptomes, with a high-capacity external decoder"
readme = "README.md"
license = { file = "LICENSE" }
# Pinned to the environment that produced the released weights: the reference
# pyenv named in docs/reproducing_chain_a.md  # noqa: legacy-name
# Python 3.8.19 with torch 2.4.1+cu121. Verified package-by-package on
# 2026-09-10; see docs/reproducing_chain_a.md.
#
# This is NOT a stale pin. The golden fixture in golden/release_forward.npz was
# captured under exactly this stack, and torch version changes the forward pass:
# replaying it under torch 2.1.2 shifts ~52% of latent elements by up to 1.4e-6.
# Bit-exact verification therefore requires this torch; anything else falls back
# to a tolerance check (scripts/verify_checkpoint.py).
requires-python = ">=3.8,<3.9"

dependencies = [
    "torch==2.4.1",
    "numpy>=1.22,<1.25",
    "scipy==1.9.3",
    "scikit-learn==1.1.3",
    "pandas==2.0.3",
    "anndata==0.9.2",
    "h5py==3.9.0",
    "wandb>=0.17",
    "tqdm>=4.66",
    "PyYAML>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
hub = ["huggingface_hub==0.27.1"]
# The encoder benchmark suite and the scIB batch-integration eval.
eval = [
    "scanpy==1.9.6",
    "scib-metrics>=0.5",
    "umap-learn>=0.5",
    "matplotlib>=3.6",
    "seaborn>=0.12",
]
# Only reachable from the perturbation-graph code paths in occam.vcell.
graph = ["torch-geometric==2.6.1", "pyarrow>=14.0"]
# Parquet export for the dataset release. Note there is deliberately no
# huggingface_hub dependency: nothing here uploads anything.
export = ["pyarrow>=14.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
occam-train       = "occam.train:main"
occam-embed       = "occam.cli.embed:main"
occam-reconstruct = "occam.cli.reconstruct:main"
occam-benchmark   = "occam.cli.benchmark:main"
occam-scib        = "occam.cli.scib:main"
occam-speed       = "occam.cli.speed:main"
occam-verify      = "occam.cli.verify:main"
occam-celleval    = "occam.cli.celleval:main"

[tool.hatch.build.targets.wheel]
packages = ["src/occam"]

[tool.hatch.build.targets.wheel.force-include]
# Ship the BMDB gene-relationship databases inside the wheel so the benchmark
# works on a fresh `pip install` and the database LICENSE travels with it.
"assets/bmdb_database" = "occam/assets/bmdb_database"
# The Ensembl -> symbol map the BMDB benchmark needs: its databases are keyed by
# symbols, the released vocabulary is Ensembl IDs. Built by
# scripts/build_gene_id_map.py; see its PROVENANCE.json.
"assets/gene_ids" = "occam/assets/gene_ids"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.pytest.ini_options]
testpaths = ["tests"]
