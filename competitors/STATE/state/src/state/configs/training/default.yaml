wandb_track: true
weight_decay: 0.0005
batch_size: 16
lr: 1e-4
max_steps: 400000
train_seed: 42
val_freq: 2000
ckpt_every_n_steps: 2000
gradient_clip_val: 10 # 0 means no clipping
gradient_accumulation_steps: 1
loss_fn: mse
devices: 1  # Number of GPUs to use for training
strategy: auto  # DDP strategy for multi-GPU training
use_mfu: false
mfu_kwargs:
    available_flops: 60e12
    use_backward: true
    logging_interval: 10
    window_size: 2
cumulative_flops_use_backward: true

# Validation cell-eval, and checkpoint selection on it. OFF by default: it only works on a split
# file whose fold has a non-empty `validation` list, and it runs a full prediction pass per
# validation. When enabled, a second ModelCheckpoint appears alongside the val_loss one, monitoring
# val/celleval/selection_score = mean(pearson_delta, discrimination_score_l1) with mode=max, saved
# as best_celleval.ckpt on validation end.
#
# Set val_freq = max_steps / (number of validations you want) so the last validation lands on the
# final step; otherwise the final checkpoint is never scored and so can never be selected.
celleval_validation:
  enabled: false
  profile: minimal        # minimal still contains pearson_delta and is far cheaper than full
  every_n_validations: 1  # leave at 1 when val_freq is already the cadence you want
  max_batches: null       # null = whole validation split; an integer is for smoke tests only
