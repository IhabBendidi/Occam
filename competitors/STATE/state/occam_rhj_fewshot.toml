# STATE on Occam's `rhj_fewshot`. OUR three h5ads, read in place.
#
# The sibling of `ihabxcell_hepg2_fewshot_zarr.toml`, which pointed at a hooke-tx zarr dump on
# a 2,000-gene panel. Nothing here is converted or duplicated: `[datasets]` names our own
# source files, exactly as `data/benchmarks/rhj_fewshot/files/*.json` records them.
#
# ⚠️ THERE IS NO `[splits]` TABLE, DELIBERATELY. With `source_format = "occam"`,
# `_read_split` computes the fold LIVE from the frozen benchmark
# (`occam_source.py::occam_fold_for_line`), so the split cannot drift from `splits.json` and
# there is no index file to regenerate. A `[splits]` entry here would be ignored, which is
# why none is written.
#
# ⚠️ `[training]` LISTS ONLY jurkat AND RPE1, and that is not an omission. HepG2 is the
# held-out context: it splits three ways (1,657 finetune / 103 validation / 621 test
# perturbations, plus all 4,976 of its controls in finetune). Jurkat and RPE1 are wholly
# training data -- the very same perturbation held out of HepG2 still TRAINS from them, which
# is what makes the task few-shot-in-a-new-context rather than never-seen-at-all.
#
# Normalisation is NOT set here. It happens once, in `competitors/shared/occam_data.py`, at
# `log1p(counts / rowsum_FULL_PANEL * 10_000)`. STATE must therefore run with
# `target_sum = null, log1p = false` (the datamodule REFUSES anything else in occam mode).
# See `docs/rhj_competitors.md` C1 for why the full-panel denominator is load-bearing.

[datasets]
hepg2 = "/rxrx/scratch/sandbox/ihab.bendidi/tx_pretrained_models/Occam/data/eval/pert/nadig_2024_hepg2.h5ad"
jurkat = "/rxrx/scratch/sandbox/ihab.bendidi/tx_pretrained_models/Occam/data/eval/pert/nadig_2024_jurkat.h5ad"
rpe1 = "/rxrx/scratch/sandbox/ihab.bendidi/tx_pretrained_models/Occam/data/eval/pert/replogle_2022_rpe1_e.h5ad"

[training]
jurkat = "train"
rpe1 = "train"
