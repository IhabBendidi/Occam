# Replogle Nadig FEW SHOT split. Same datasets and fold as ihabxcell_hepg2_zarr.toml; the ONLY
# functional difference is the [splits] path.
#
# WHY A SEPARATE FILE rather than editing ihabxcell_hepg2_zarr.toml: that file is deliberately
# shared with TxPert, whose zarr_loader splits by perturbation NAME, never reads the "validation"
# key, and ends with `train_names |= (all_names - test_names)` -- so handing it a non-empty
# validation split would sweep those perturbations into TRAINING. Editing the shared file would
# silently leak validation into TxPert. Opt-in per competitor, and the old file stays able to
# reproduce previously reported numbers.
#
# WHAT THIS FIXES FOR STATE. The old split has validation: 0, so val_map is empty, val_datasets is
# [], and zarr_perturbation.val_dataloader() silently returned the TEST loader. val_loss -- and
# therefore the existing ModelCheckpoint(monitor="val_loss") -- has been computed and selected on
# TEST for every replogle run to date.
#
# The split this points at:
#   finetune    64,913   (59,937 perturbed + 4,976 controls)
#   validation   4,825   (60 supplied HepG2 validation genes, all perturbed)
#   test        26,878   (all perturbed; byte-identical to the old split's test set)
#
# Expected "Train / Val / Test sizes" log line: <64,913 + jurkat + k562 + rpe1> / 9801 / 31854.
# That is CORRECT, not a discrepancy: setup() masks the JSON indices with is_pert, then adds every
# control row of any cell type present in the split (zarr_perturbation.py:915-921), so the 4,976
# HepG2 controls join val and test too. The quantity that must match across models is the PERTURBED
# count -- 59,937 / 4,825 / 26,878 -- and it does. Controls are a scoring input, not a holdout, and
# the same physical control rows legitimately appear in all three splits.
#
# Use with:
#   data=perturbation_zarr data.kwargs.toml_config_path=".../ihabxcell_hepg2_fewshot_zarr.toml"

[datasets]
ihabxcell_hepg2  = "/rxrx/scratch/hooke_tx/public/ihabxcell_replogle_nadig_hepg2"
ihabxcell_jurkat = "/rxrx/scratch/hooke_tx/public/ihabxcell_replogle_nadig_jurkat"
ihabxcell_k562   = "/rxrx/scratch/hooke_tx/public/ihabxcell_replogle_nadig_k562"
ihabxcell_rpe1   = "/rxrx/scratch/hooke_tx/public/ihabxcell_replogle_nadig_rpe1"

[training]
ihabxcell_hepg2 = "train"
ihabxcell_jurkat = "train"
ihabxcell_k562 = "train"
ihabxcell_rpe1 = "train"

# Index-based holdouts (only hepg2 has one today => the other 3 are train-only).
[splits]
ihabxcell_hepg2 = "/rxrx/scratch/hooke_tx/public/ihabxcell_replogle_nadig_hepg2/splits/split_replogle_nadig_fewshot__v1.json"

[split_fold]
ihabxcell_hepg2 = 0
