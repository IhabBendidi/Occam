# TxPert adjacency-map arm of the hooke-tx replogle_nadig benchmark.
#
# Data: the canonical zarr datasets (X.zarr + obs/var.parquet) that ../STATE and ../PerturbDiff
# also train on, with the index-based HepG2 holdout from
# /rxrx/data/valence/external_benchmarking/cell_eval/splits/replogle_nadig_xcell.json (fold 0).
# Train = jurkat + k562 + rpe1 in full, plus the non-held-out HepG2 perturbations.
#
# Derived from config-xcell-v2-best-adj-map.yaml. Two differences:
#   * datamodule reads zarr instead of the 22 GB merged h5ad, and does NOT renormalize
#     (X.zarr is already log1p(1e4); the other two arms train on that scale untouched).
#   * training HPs are the sweep optimum, not the file's shipped defaults -- see below.
#
# Run:
#   uv run python main.py --config-name=config-txpert-zarr-adjmap

global:
  use_added_data: false

wandb:
  name: txpert-zarr-adjmap
  project: Hooke-External
  entity: valencelabs

model:
  model_type: gears_derivate
  no_basal_model: false
  no_pert_model: false
  # Sweep optimum (scripts/sweeps/sweep-xcell-v2-training-params.yaml, 217 runs):
  # dropout 0.1 / hidden 512 / latent 128 / lr 3e-4 / warmup 5 / wd 0 -> test_pearson_delta
  # 0.4779, vs 0.4660 for the shipped defaults (0.2 / 512 / 64 / 1e-3 / 5 / 0).
  # NOTE: xcell_v2 has no validation split, so that sweep maximised a TEST metric. The
  # hyperparameters are therefore test-selected; report them with that caveat. Checkpoint
  # selection is NOT test-driven here (see training.checkpoint below).
  hidden_dim: 512
  latent_dim: 128
  dropout: 0.1
  use_batch_norm: true
  use_layer_norm: false
  omit_cntr: false
  mse_weight: 1
  slow_benchmark: false

  cntr_model:
    model_type: mlp
    rank: 16
    decode_latent: false
    use_batch_norm: true
    use_layer_norm: false

  # Unchanged from the best adjacency-map configuration. Per upstream's own sweeps
  # (CLAUDE.md): all 4 KGs >> any subset, adj_deg=1 >> 2 >> 3, normalize=none best,
  # only_reverse=true best, and adjacency map > GNN.
  pert_model:
    pert_type: gene
    model_type: simple_adjacency_map
    hidden_dim: 128
    dropout: 0.2
    adj_deg: 1
    normalize: none
    undir_or_addcol: none
    self_loops: false
    poly_sum: false
    only_reverse: true
    kg_list: [go, string, pxmap, txmap]

datamodule:
  zarr: true
  zarr_manifest_path: ${hydra:runtime.cwd}/configs/manifests/ihabxcell_hepg2_zarr.toml
  # Preprocessed-AnnData cache. Inside the checkout and gitignored -- never the shared
  # /rxrx/data/valence/.../cache_v2 (2.8 TB, another user's).
  cache_dir: ${hydra:runtime.cwd}/cache
  data_dir: null          # no GEARS-style h5ad root; expression comes from the manifest
  auxiliary_dir: null     # Pharos knowledge levels are slow_benchmark-only
  match_cntr: true
  avg_cntr: true
  batch_size: 64
  xtraining_strategy: train_together_implicit
  test_cell_type: hepg2
  train_cell_types: all
  combine_strategy: intersect
  # Inert on the zarr path: the datasets are already the benchmark's 2,000 genes on a
  # log1p(1e4) scale, and no HVG selection / normalization / DE filtering is applied.
  hvg_number: 2000
  target_sum: null
  min_cells: 25
  min_de_genes: 50
  knockdown_threshold: -0.3
  use_predefined_splits: true
  embed_cntr: true
  test_split: 0
  use_cache: true
  n_jobs_preprocessing: 4
  debug: false
  obsm_key: raw

graph:
  # Shared, read-only. Byte-identical to the graphs hooke-tx's own AdjacencyMapEmbedder reads
  # (hooke_tx/architecture/embedding.py), so nothing is copied. Needs the D-Valence-R group.
  cache_dir: /rxrx/data/valence/pathfinder/modules/gspp/graphs
  graph_cfg:
    go:
      graph_type: go
      reduce2perts: true
      norm_weights: true
      mode: top_20
    string:
      graph_type: string
      reduce2perts: true
      norm_weights: false
      mode: top_20
    pxmap:
      graph_type: pxmap-top1
      reduce2perts: true
      norm_weights: false
      mode: top_20
    txmap:
      graph_type: txmap-top1
      reduce2perts: true
      norm_weights: false
      mode: top_20

training:
  seed: 1
  epochs: 50
  lr: 0.0003
  lr_scheduler:
    type: cosine
    warmup_epochs: 5
    total_epochs: ${training.epochs}
  weight_decay: 0.0
  check_val_every_n_epoch: 1
  checkpoint:
    dirpath: ${hydra:runtime.cwd}/cache/checkpoints/txpert-zarr-adjmap
    # There is no validation split, so upstream monitored `test_pearson_delta` here --
    # i.e. it selected the checkpoint on the test set. Keep the last epoch instead.
    save_top_k: 0
    save_last: true
    every_n_epochs: 5
  run_val_on_train_data: false
  match_cntr_for_eval: true

# cell-eval export: same protocol as ../STATE and ../PerturbDiff.
celleval:
  enable: true
  output_dir: ${hydra:runtime.cwd}/outputs/celleval
  profile: full

mode: train
checkpoint_path: null
