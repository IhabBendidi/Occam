# ihabxcell_hepg2_zarr.toml with ONE line changed: the [splits] entry points at the
# Replogle Nadig Few Shot split, which has a real validation list.
#
#   ihabxcell_hepg2_zarr.toml  -> replogle_nadig_xcell.json           validation: []
#   this file                  -> split_replogle_nadig_fewshot__v1.json  validation: 4,825
#
# A NEW FILE, deliberately, not an edit. The original is byte-identical to STATE's and
# PerturbDiff's copies and tests/test_zarr_pipeline.py enforces that; editing it in place would
# silently change every historical arm's split. PerturbDiff made the same choice
# (../../../PerturbDiff/configs/manifests/ihabxcell_hepg2_fewshot_zarr.toml) and the two fewshot
# manifests carry the same [splits] path.
#
# WHY A NAME-BASED SPLIT CAN REPRESENT THIS AT ALL. gspp splits by perturbation name, so a split
# that cut a perturbation in half could not be expressed. Verified against obs_raw.parquet:
#
#   validation = 60 whole perturbations = 4,825 HepG2 cells
#   validation & finetune overlap = 0        validation & test overlap = 0
#   every HepG2 cell of those 60 genes is in validation (4,825 == 4,825)
#
# Those 60 perturbations are held out of HepG2 training only; they keep training in
# jurkat/k562/rpe1, which is exactly what hooke-tx, STATE and PerturbDiff do on this split.

[datasets]
ihabxcell_hepg2  = "/rxrx/scratch/hooke_tx/public/ihabxcell_replogle_nadig_hepg2"
ihabxcell_jurkat = "/rxrx/scratch/hooke_tx/public/ihabxcell_replogle_nadig_jurkat"
ihabxcell_k562   = "/rxrx/scratch/hooke_tx/public/ihabxcell_replogle_nadig_k562"
ihabxcell_rpe1   = "/rxrx/scratch/hooke_tx/public/ihabxcell_replogle_nadig_rpe1"

[training]
ihabxcell_hepg2 = "train"
ihabxcell_jurkat = "train"
ihabxcell_k562 = "train"
ihabxcell_rpe1 = "train"

# Index-based holdout. Only hepg2 has one: the benchmark's test perturbations exist only in
# that cell line, so jurkat/k562/rpe1 are wholly training data.
[splits]
ihabxcell_hepg2 = "/rxrx/scratch/hooke_tx/public/ihabxcell_replogle_nadig_hepg2/splits/split_replogle_nadig_fewshot__v1.json"

[split_fold]
ihabxcell_hepg2 = 0
