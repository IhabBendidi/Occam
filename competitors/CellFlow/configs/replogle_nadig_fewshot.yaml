# CellFlow train config -- Replogle Nadig FEW SHOT split, the benchmark the other four arms use
# (split_replogle_nadig_fewshot__v1.json: finetune 64,913 / validation 4,825 / test 26,878;
# 901 / 60 / 380 perturbations; all 4,976 HepG2 negative controls in finetune).
#
# Derived from replogle_nadig_state.yaml, which runs a DIFFERENT protocol (945 test perts, NCs
# in test) and whose numbers must not be mixed with these. The model block below is byte-identical
# to it; check that with:
#   diff <(grep -vE '^\s*(#|$)' configs/replogle_nadig_state.yaml) \
#        <(grep -vE '^\s*(#|$)' configs/replogle_nadig_fewshot.yaml)
#
# THE DELTAS:
#   1. split_path              -> the few-shot split
#   2. control_from_split_key  REMOVED. All 4,976 HepG2 NCs are in finetune here, so pulling
#      controls "from test" finds none and hooke_bridge/load.py raises. The train-side merge is
#      a np.unique union with the finetune rows, so the key is simply unnecessary.
#   3. vocabulary_data_dirs    -> all four dumps. Widens the one-hot gene vocabulary from the
#      training cells to the whole dataset: 2,023 tokens + pad = 2,024, exactly the size of
#      STATE's pert_onehot_map.pt. Without it, 8 of the 380 test perturbations (CACTIN, CDC20,
#      CMTR2, LAMB1, MRM1, NOS1AP, SLC16A5, SPAG7) have no column -- they were never assayed in
#      jurkat/k562/rpe1 either -- and cf.predict aborts with "Representation ... not found".
#   4. pca.n_comps  50 -> 256  to match hooke-tx's PCA flow on this same data. 50 caps what the
#      model can express before it does anything; the tutorial uses 100 and hooke-tx uses 256.
#      NOTE the recorded pearson_delta 0.4044 was measured at 50 and is NOT comparable to runs
#      from this config.
#   5. n_conditions_on_*       -> 60, i.e. ALL validation perturbations. The validation sampler
#      draws conditions without replacement and defaults to 8 / 32, so the default would score a
#      random 8 of 60 and call it the validation score.
#
# Validation scores with real controls injected. Selection is by
# mean(pearson_delta, discrimination_score_l1) via the SHARED scorer, so the selection metric and
# the reported metric come from one code path and one cell-eval version.

data:
  # Evaluated line: contributes only its finetune rows to training.
  data_dir: /rxrx/scratch/hooke_tx/public/ihabxcell_replogle_nadig_hepg2
  split_path: /rxrx/scratch/hooke_tx/public/ihabxcell_replogle_nadig_hepg2/splits/split_replogle_nadig_fewshot__v1.json
  fold: 0
  train_key: finetune
  valid_key: validation
  # Supporting lines: every cell trains, which is what teaches the held-out genes.
  train_sources:
    - data_dir: /rxrx/scratch/hooke_tx/public/ihabxcell_replogle_nadig_jurkat
    - data_dir: /rxrx/scratch/hooke_tx/public/ihabxcell_replogle_nadig_k562
    - data_dir: /rxrx/scratch/hooke_tx/public/ihabxcell_replogle_nadig_rpe1
  # DELTA 2: no control_from_split_key. All 4,976 HepG2 NCs are already in finetune.
  max_control_cells: null
  # DELTA 3: one-hot vocabulary over the whole dataset, not just the training cells.
  vocabulary_data_dirs:
    - /rxrx/scratch/hooke_tx/public/ihabxcell_replogle_nadig_hepg2
    - /rxrx/scratch/hooke_tx/public/ihabxcell_replogle_nadig_jurkat
    - /rxrx/scratch/hooke_tx/public/ihabxcell_replogle_nadig_k562
    - /rxrx/scratch/hooke_tx/public/ihabxcell_replogle_nadig_rpe1
  # Condition on cell line, and match each perturbation to controls of its own line.
  sample_covariates: [cell_type]
  split_covariates: [cell_type]
  # 2000 HVG panel shared by all four dumps.
  selected_genes_path: null
  on_missing_genes: error
  feature: zarr
  # Source h5ad is already log1p(target_sum=10000) -- skip runtime normalisation.
  target_sum: null
  log1p: false
  max_combination_length: 1
  max_cells: null

pca:
  # DELTA 4: match hooke-tx's PCA width on this benchmark.
  n_comps: 256

model:
  solver: otfm
  condition_mode: deterministic
  pooling: mean
  # Zebrafish genetic tutorial: MLP on the pert token before pooling.
  # Keys must match prepare_data groups (`gene`) and sample_covariates (`cell_type`).
  layers_before_pool:
    gene:
      layer_type: mlp
      dims: [512, 512]
      dropout_rate: 0.0
    cell_type:
      layer_type: mlp
      dims: [512, 512]
      dropout_rate: 0.0
  layers_after_pool:
    layer_type: mlp
    dims: [1024, 1024]
    dropout_rate: 0.0
  condition_embedding_dim: 256
  cond_output_dropout: 0.0
  time_freqs: 1024
  time_encoder_dims: [1024, 1024, 1024]
  hidden_dims: [2048, 2048, 2048]
  decoder_dims: [4096, 4096, 4096]
  conditioning: concatenation
  # PBMC uses 0.5; ComboSciPlex uses 1.5 on PCA cell lines. Midpoint for Replogle.
  probability_path:
    constant_noise: 0.5
  # match_fn: library default (epsilon=1, tau_a=tau_b=1) -- cell-line / ComboSciPlex.
  # Best balanced setting in the Replogle sweep (CellEval Pearson/direction).
  linear_projection_before_concatenation: true
  learning_rate: 5.0e-5
  optimizer_multi_steps: 20
  seed: 0

train:
  num_iterations: 100000
  batch_size: 1024
  # 100000 / 20000 = 5 validations, plus the unconditional on_train_end pass, so the final state
  # is always a selection candidate.
  valid_freq: 20000
  # DELTA 5: score every validation perturbation, not a random sample of 8 / 32.
  n_conditions_on_log_iteration: 60
  n_conditions_on_train_end: 60
  # Validation cell-eval and best-state selection. Scored by the SHARED scorer under hooke-tx's
  # own interpreter, so the selection metric and the reported metric come from one code path and
  # one cell-eval version -- this venv resolves pdex 0.3.0 against 0.2.2 elsewhere, and
  # CellFlow's own _run_celleval passes no pdex_kwargs.
  selection:
    enabled: true
    profile: full
    scorer_py: /rxrx/scratch/sandbox/ihab.bendidi/bc-hooke/src/hooke-tx/.venv/bin/python
    scorer: /rxrx/scratch/sandbox/ihab.bendidi/bc-hooke/src/hooke-tx/hooke_tx/eval/celleval_artifacts.py
    hooke_tx_dir: /rxrx/scratch/sandbox/ihab.bendidi/bc-hooke/src/hooke-tx

output:
  dir: /rxrx/scratch/sandbox/${USER}/cellflow/replogle_nadig_fewshot
  run_name: replogle_nadig_fewshot_fold0
