# CellFlow train config — Norman2019 (Hooke public dump), fold 0.
# Paths are absolute so sbatch can run from competitors/CellFlow/cellflow/.

data:
  data_dir: /rxrx/scratch/hooke_tx/public/norman2019
  split_path: /rxrx/data/valence/external_benchmarking/cell_eval/splits/norman.json
  fold: 0
  # Trek gene list is larger than Norman's var panel → intersect.
  selected_genes_path: configs/metadata/trek_selected_ens_ids_v0.txt
  on_missing_genes: intersect
  feature: zarr
  target_sum: 300000
  log1p: true
  max_combination_length: 2
  # Set e.g. 2048 for a quick smoke; null = full fold.
  max_cells: null
  train_key: finetune
  valid_key: validation
  # cell-eval Norman puts all controls in finetune; CellFlow valid needs sources.
  inject_train_controls: true
  max_injected_controls: null  # null = all train controls

pca:
  n_comps: 50

model:
  solver: otfm
  # Leaner than CellFlow tutorial defaults so a first Norman GPU run is tractable.
  # Bump toward (2048,…) / (4096,…) for paper-scale capacity later.
  condition_mode: deterministic
  pooling: mean
  condition_embedding_dim: 128
  cond_output_dropout: 0.1
  time_freqs: 64
  time_encoder_dims: [512, 512]
  hidden_dims: [512, 512, 512]
  decoder_dims: [512, 512, 512]
  conditioning: concatenation
  seed: 0

train:
  num_iterations: 20000
  batch_size: 1024
  valid_freq: 2000
  n_conditions_on_log_iteration: 8
  n_conditions_on_train_end: 32

output:
  # Override with OUTPUT_DIR / RUN_NAME env in sbatch if desired.
  dir: /rxrx/scratch/sandbox/alessandro.palma/cellflow/norman
  run_name: norman_fold0
