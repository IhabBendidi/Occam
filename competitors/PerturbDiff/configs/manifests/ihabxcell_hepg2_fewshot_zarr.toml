# Replogle Nadig FEW SHOT split. Same datasets, same fold, different split file.
#
# WHY A SEPARATE FILE rather than editing ihabxcell_hepg2_zarr.toml, which this is otherwise a copy
# of: that file is also read by STATE and TxPert, and the three are deliberately kept identical.
# TxPert cannot handle a non-empty validation split yet -- gspp/data/zarr_loader.py splits by
# perturbation NAME, never reads the "validation" key, and its final
# `train_names |= (all_names - test_names)` would sweep the validation perturbations straight into
# training. Editing the shared file would silently leak validation into TxPert's training set,
# which is worse than the status quo. So this is opt-in per competitor.
#
# The old file stays so previously reported numbers remain reproducible.
#
# The split it points at:
#   finetune    64,913
#   validation   4,825   (60 supplied HepG2 validation genes, mean 80.4 cells each)
#   test        26,878   (byte-identical to replogle_nadig_xcell.json's test set)
# None of the validation genes is a test perturbation, and all 4,976 control cells stay in finetune.
#
# WHAT "SAME CELLS" MEANS HERE. split_index_json adds ALL control rows to every non-empty split, so
# PerturbDiff's own row counts are 64,913 / 9,801 / 31,854 rather than the JSON's
# 64,913 / 4,825 / 26,878. That is not a discrepancy: the JSON keeps the 4,976 controls in finetune
# and hooke-tx re-injects them at scoring time via celleval `inject_controls_from="finetune"`.
# The quantity that must match across models is the PERTURBED cells, since those are what get
# predicted and scored, and it does exactly:
#
#   finetune    59,937 perturbed
#   validation   4,825 perturbed
#   test        26,878 perturbed
#
# Controls are a scoring input each model supplies by its own convention, not part of the holdout.
#
# PerturbDiff already reads all three keys -- src/data/split_strategy.py maps
# ("train","finetune"), ("validation","validation"), ("test","test") -- so pointing at this file is
# sufficient to give it a real validation set. Previously `validation` was empty, so its only live
# validation metric was computed on TEST.

[datasets]
ihabxcell_hepg2  = "/rxrx/scratch/hooke_tx/public/ihabxcell_replogle_nadig_hepg2"
ihabxcell_jurkat = "/rxrx/scratch/hooke_tx/public/ihabxcell_replogle_nadig_jurkat"
ihabxcell_k562   = "/rxrx/scratch/hooke_tx/public/ihabxcell_replogle_nadig_k562"
ihabxcell_rpe1   = "/rxrx/scratch/hooke_tx/public/ihabxcell_replogle_nadig_rpe1"

[training]
ihabxcell_hepg2 = "train"
ihabxcell_jurkat = "train"
ihabxcell_k562 = "train"
ihabxcell_rpe1 = "train"

# Index-based holdout. Only hepg2 has one: the benchmark's test perturbations
# exist only in that cell line, so jurkat/k562/rpe1 are wholly training data.
[splits]
ihabxcell_hepg2 = "/rxrx/scratch/hooke_tx/public/ihabxcell_replogle_nadig_hepg2/splits/split_replogle_nadig_fewshot__v1.json"

[split_fold]
ihabxcell_hepg2 = 0
