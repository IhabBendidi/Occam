# PerturbDiff on Occam's `rhj_fewshot`. OUR three h5ads, read in place.
#
# The sibling of `ihabxcell_hepg2_fewshot_zarr.toml`, which pointed at the upstream benchmark canonical zarr
# dumps on a 2,000-gene panel. Nothing here is converted or duplicated: `[datasets]` names our
# own source files, exactly as `data/benchmarks/rhj_fewshot/files/*.json` records them.
#
# ⚠️ THERE IS NO `[splits]` TABLE, DELIBERATELY. With `source_format = "occam"`,
# `split_index_occam` computes the fold LIVE from the frozen benchmark, so the split cannot
# drift from `splits.json` and there is no index file to regenerate. `occam_setup` REFUSES a
# `[splits]` table rather than ignoring one.
#
# ⚠️ `[training]` LISTS ONLY jurkat AND rpe1, and that is not an omission. HepG2 is the
# held-out context: it splits three ways (1,657 train / 103 validation / 621 test
# perturbations, with all 4,976 of its controls added to every non-empty split). jurkat and
# RPE1 are wholly training data -- the very same perturbation held out of HepG2 still TRAINS
# from them, which is what makes the task few-shot-in-a-new-context rather than
# never-seen-at-all.
#
# One dataset is one CELL LINE, and the line is resolved from the filename
# (`occam_line_from_path`), which REFUSES anything ambiguous: a source silently bound to the
# wrong line trains on the held-out context and the run looks fine.

[datasets]
hepg2 = "/rxrx/scratch/sandbox/ihab.bendidi/tx_pretrained_models/Occam/data/eval/pert/nadig_2024_hepg2.h5ad"
jurkat = "/rxrx/scratch/sandbox/ihab.bendidi/tx_pretrained_models/Occam/data/eval/pert/nadig_2024_jurkat.h5ad"
rpe1 = "/rxrx/scratch/sandbox/ihab.bendidi/tx_pretrained_models/Occam/data/eval/pert/replogle_2022_rpe1_e.h5ad"

[training]
jurkat = "train"
rpe1 = "train"
