# Filesystem paths for the hooke-tx zarr benchmark.
#
# Select with `path=hooke_tx_path`. Unlike trixie_path.yaml (which points at the
# published h5ad downloads) this points at the canonical zarr datasets we already
# evaluate STATE on, and at a writable scratch root for outputs.

# Logging / checkpoint roots. save_dir becomes trainer.default_root_dir, and
# cfg.save_dir_path is derived from it as "{save_dir}/{run_name}".
wandb:
  logging_dir: "/rxrx/scratch/sandbox/ihab.bendidi/perturbdiff_out/wandb"
diffusion:
  save_dir: "/rxrx/scratch/sandbox/ihab.bendidi/perturbdiff_out/runs"

# Root for the pretrained embedding pickles that cov_encoding interpolates.
# Not needed by the default one-hot config, but genept / llm read from here.
# Populated with a targeted download (not the full 3 TB release):
#   uv sync --extra download
#   .venv/bin/hf download katarinayuan/PerturbDiff_data \
#     perturb_data/gene_names/replogle_gene_emb_dict_perturbation_emb_dict.pkl \
#     --repo-type dataset --local-dir <parent of this dir>
tmp_dir: "/rxrx/scratch/sandbox/ihab.bendidi/perturbdiff_out/assets_dl/perturb_data"

# MUST be writable: dataset_grouping pickles the cell-set grouping here. Do not
# point this at the read-only dataset root.
indices_cache_dir: "/rxrx/scratch/sandbox/ihab.bendidi/perturbdiff_out/indices_cache/"

# Benchmark inputs, shared with ../STATE/state. Absolute, like STATE's own
# train_state_zarr.sh, so a run works from any working directory.
manifest_file: "/rxrx/scratch/sandbox/ihab.bendidi/bc-hooke/src/hooke-tx/competitors/PerturbDiff/configs/manifests/ihabxcell_hepg2_zarr.toml"
selected_gene_file: "/rxrx/scratch/sandbox/ihab.bendidi/bc-hooke/src/hooke-tx/configs/metadata/replogle_nadig_selected_ens_ids.txt"
