data:
  name: ZarrPerturbationDataModule
  kwargs:
    toml_config_path: null
    source_format: occam
    occam_bench_dir: /rxrx/scratch/sandbox/ihab.bendidi/tx_pretrained_models/Occam/data/benchmarks/rhj_fewshot
    occam_target_sum: 10000.0
    occam_log1p: true
    occam_verify_sources: true
    occam_max_cells_per_line: null
    feature_loading: ram
    selected_ensembl_gene_ids_path: null
    target_sum: null
    log1p: false
    split_idx: 0
    pert_feature_mode: onehot
    pert_feature_path: null
    embed_key: X_hvg
    output_space: gene
    batch_col: batch_center
    cell_type_key: cell_type
    pert_col: gene_pert
    control_pert: empty
    num_workers: 0
    basal_mapping_strategy: random
    n_basal_samples: 1
    should_yield_control_cells: true
    barcode: false
    drop_last: false
    is_log1p: true
    random_seed: 42
  output_dir: null
  debug: true
model:
  name: state
  checkpoint: null
  device: cuda
  kwargs:
    cell_set_len: 64
    blur: 0.05
    hidden_dim: 336
    loss: energy
    confidence_token: false
    n_encoder_layers: 1
    n_decoder_layers: 1
    predict_residual: true
    softplus: true
    freeze_pert_backbone: false
    transformer_decoder: false
    finetune_vci_decoder: false
    residual_decoder: false
    batch_encoder: true
    use_batch_token: false
    mask_attn: false
    use_effect_gating_token: false
    distributional_loss: energy
    init_from: null
    mmd_num_chunks: 1
    randomize_mmd_chunks: false
    llm_name: null
    transformer_backbone_key: llama
    transformer_backbone_kwargs:
      bidirectional_attention: true
      max_position_embeddings: 64
      hidden_size: 336
      intermediate_size: 3072
      num_hidden_layers: 8
      num_attention_heads: 12
      num_key_value_heads: 12
      head_dim: 64
      use_cache: false
      attention_dropout: 0.0
      hidden_dropout: 0.0
      layer_norm_eps: 1.0e-06
      pad_token_id: 0
      bos_token_id: 1
      eos_token_id: 2
      tie_word_embeddings: false
      rotary_dim: 0
      use_rotary_embeddings: false
    lora:
      enable: false
      r: 16
      alpha: 32
      dropout: 0.05
      bias: none
      target: auto
      adapt_mlp: false
      task_type: FEATURE_EXTRACTION
      merge_on_eval: false
training:
  wandb_track: true
  weight_decay: 0.0005
  batch_size: 64
  lr: 0.001
  max_steps: 80000
  train_seed: 42
  val_freq: 16000
  ckpt_every_n_steps: 2000
  gradient_clip_val: 10
  gradient_accumulation_steps: 1
  loss_fn: mse
  devices: 1
  strategy: auto
  use_mfu: false
  mfu_kwargs:
    available_flops: 60000000000000.0
    use_backward: true
    logging_interval: 10
    window_size: 2
  cumulative_flops_use_backward: true
  celleval_validation:
    enabled: true
    profile: minimal
    every_n_validations: 1
    max_batches: null
wandb:
  entity: valencelabs
  project: Occam-Competitors
  local_wandb_dir: ./wandb_logs
  tags:
  - rhj_fewshot
name: occam_s42
output_dir: /rxrx/scratch/sandbox/ihab.bendidi/tx_pretrained_models/Occam/runs/competitors/state
use_wandb: true
overwrite: false
return_adatas: false
pred_adata_path: null
true_adata_path: null
