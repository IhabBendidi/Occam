data:
  occam_bench_dir: /rxrx/scratch/sandbox/ihab.bendidi/tx_pretrained_models/Occam/data/benchmarks/rhj_fewshot
  occam_target_sum: 10000.0
  occam_log1p: true
  train_key: finetune
  valid_key: validation
  max_control_cells: null
  sample_covariates:
  - cell_type
  split_covariates:
  - cell_type
  selected_genes_path: null
  on_missing_genes: error
  target_sum: null
  log1p: false
  max_combination_length: 1
  max_cells: null
pca:
  n_comps: 256
model:
  solver: otfm
  condition_mode: deterministic
  pooling: mean
  layers_before_pool:
    gene:
      layer_type: mlp
      dims:
      - 512
      - 512
      dropout_rate: 0.0
    cell_type:
      layer_type: mlp
      dims:
      - 512
      - 512
      dropout_rate: 0.0
  layers_after_pool:
    layer_type: mlp
    dims:
    - 1024
    - 1024
    dropout_rate: 0.0
  condition_embedding_dim: 256
  cond_output_dropout: 0.0
  time_freqs: 1024
  time_encoder_dims:
  - 1024
  - 1024
  - 1024
  hidden_dims:
  - 2048
  - 2048
  - 2048
  decoder_dims:
  - 4096
  - 4096
  - 4096
  conditioning: concatenation
  probability_path:
    constant_noise: 0.5
  linear_projection_before_concatenation: true
  learning_rate: 5.0e-05
  optimizer_multi_steps: 20
  seed: 42
train:
  num_iterations: 100000
  batch_size: 1024
  valid_freq: 20000
  n_conditions_on_log_iteration: null
  n_conditions_on_train_end: null
  selection:
    enabled: true
    profile: full
output:
  dir: /rxrx/scratch/sandbox/ihab.bendidi/tx_pretrained_models/Occam/runs/competitors/cellflow
  run_name: occam_s42
