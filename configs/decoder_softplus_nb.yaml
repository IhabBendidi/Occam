# =====================================================================
# Occam-small, stage 3 RETRAIN: softplus + negative binomial.
#
# ⚠️ PREPARED, NOT RUN. Nothing in this repo submits it. Launch it yourself
#    with scripts/slurm/retrain_decoder.sbatch when you are ready.
#
# WHY THIS EXISTS
# ---------------
# The released decoder (configs/occam_small.yaml, stage 3) uses a
# `rectified_sigmoid` head with a smooth-L1 loss. That head is exactly 0 for
# every non-positive pre-activation, and its gradient there is exactly 0 too,
# so genes that are rarely detected get pinned and never recover. Measured on
# the released weights: 83.6% of the 44,728 genes come out constant across
# cells (scripts/verify_checkpoint.py step 6).
#
# Replacing the head with softplus and the loss with a negative binomial fixes
# most of that. Measured on the decoder-only cell-eval panels, `injctrl`,
# pearson_delta (higher is better):
#
#   | arm                                          | nadig pΔ | nadig disc_l2 | nadig sig genes | TREK pΔ |
#   |----------------------------------------------|----------|---------------|-----------------|---------|
#   | rectified_sigmoid + smooth_l1, calibrated    |   0.2285 |        0.9798 |           3,361 |       - |
#   | softplus + smooth_l1, calibrated             |   0.5807 |        0.9885 |           1,588 |  0.8045 |
#   | softplus + nb 5e-5, calibrated  <- THIS ARM  |   0.6009 |        0.9907 |           1,572 |  0.8056 |
#   | softplus + nb 5e-5, NO calibration           |   0.2336 |        0.9202 |           7,330 |  0.2060 |
#
# Ground truth is 262.2 significant genes per perturbation on nadig, so the
# drop from 3,361 to 1,572 is also a large reduction in DE inflation.
#
# READ THE LAST ROW. Calibration is the dominant term, not the loss: it moves
# pearson_delta 0.23 -> 0.60 on nadig and 0.21 -> 0.81 on TREK, while the
# loss/head choice is worth about 0.02. Control-fit per-gene quantile
# calibration is part of the EVALUATION path (occam.vcell.panel.calibrate), and
# without it this arm is no better than the released one.
#
# Secondary reason to pair softplus with `nb` rather than shipping softplus
# alone: softplus x smooth_l1 showed ~38% validation-loss spikes at the two
# lower learning rates, while softplus x nb tracked train smoothly to epoch
# 200 with no NaN. The NB likelihood tames the unbounded softplus output.
#
# WHAT IS HELD FIXED
# ------------------
# The encoder. This retrains stage 3 only, on the same frozen small/512
# encoder, so `input_dim` is 512 -- not the 768 of the base-encoder decoder the
# measurements above came from. The head, loss and learning rate transfer; the
# absolute numbers may not.
#
# WHAT WOULD FALSIFY IT
# ---------------------
# A calibrated pearson_delta at or below the released decoder's 0.2285 on
# nadig. That would mean the gain does not survive the encoder change, and the
# released rectified_sigmoid decoder should stay.
# =====================================================================
version: 1
name: occam_small_decoder_softplus_nb
seed: 42
device: cuda

paths: !include paths.yaml

run:
  root: ./runs
  stages: [decoder]                 # stages 1 and 2 are reused as-is
  runner: inprocess
  resume: auto
  wandb:
    enabled: true
    project: occam
    tags: [occam, small, decoder-retrain, softplus, nb]

data:
  train: ${paths.train_corpus}
  val: null
  train_gene_col: gene_symbol
  expect:
    n_obs: 1434299
    n_genes: 44728

stages:
  decoder:
    # The same finetuned encoder the released decoder was built on.
    init_from: checkpoints/reference/occam_small_stage2_finetune.pth

    encoder:
      freeze_encoder: true
      encoder_lr: 1.0e-05           # unused while frozen
      skip_normalize: false
      skip_log1p: false

    architecture:
      decoder_size: null
      # 2048 x 4, matching the decoder every H1 arm actually used.
      #
      # ⚠️ Do NOT "upgrade" this to 3072 x 10. That geometry wins decoder-only
      #    cell-eval (TREK pΔ 0.8316 vs 0.8133, nadig 0.6073 vs 0.5969) but
      #    LOSES virtual-cell transfer by 1.6-2.9 sd even after its own
      #    learning-rate sweep: negative in 6/6 seed-paired arms, and one arm
      #    diverged 3/3 with loss=nan from epoch 1. Decoder-only quality does
      #    not predict transfer. See docs/evaluation.md.
      decoder_hidden_dim: 2048
      decoder_num_blocks: 4
      decoder_dropout: 0.3
      decoder_se_reduction: 16

      # The change that matters. Strictly positive everywhere, nowhere-zero
      # gradient -- no dead-unit trap. Unbounded above, unlike
      # rectified_sigmoid's log1p(2000) ceiling, which is why it is paired
      # with the NB likelihood below.
      decoder_output_activation: softplus

      decoder_weight_tie: false
      decoder_bottleneck_k: 1
      decoder_monarch_blocks: 0
      decoder_kron_rank: 0
      decoder_glu: false
      decoder_sparsity_24: false

    optim:
      # Per-gene learned dispersion (log_theta). Note the caveat in
      # occam.losses.NBDecoderLoss: on library-normalised + log1p data the
      # "counts" recovered by expm1 are non-integer, so the discrete NB
      # assumption is only approximate.
      loss_type: nb
      lr: 5.0e-05
      eta_min: 1.0e-07
      weight_decay: 0.01
      gradient_clip: 0.5
      batch_size: 1024
      epochs: 200
      smooth_l1_beta: 2.0           # unused under loss_type: nb
      weight_init: default

      # log_theta trains at the global lr. A decoupled, higher dispersion
      # learning rate was the one real lever found in an earlier sweep
      # (+0.036 overlap@N at 1e-2, confirmed across seeds), BUT that was a
      # different corpus, geometry and loss (Replogle 2k-HVG, 12288x4, zinb).
      # Treat it as one arm to try, not a default.
      dispersion_lr: null           # try: 1.0e-02
      disp_theta_init: 0.0
      zinb_pi_init: -2.0            # unused under loss_type: nb

    data:
      data_mode: optim
      val_split: 0.1
      optim_chunk_size: 8192
      optim_buffer_chunks: 4
      gene_presence_mask: false
      presence_shift: 1.0
      min_gene_overlap_pct: null
      train_gene_col: gene_symbol
      eval_gene_col: ensembl_gene_id

    augmentation:
      no_augmentation: false
      gvf_cache_dir: null
      # Same augmentation as the released run, so the head/loss change is the
      # only axis that moves.
      aug_hparams:
        final_cov_influence_weight: 0.5
        final_gene_jitter_strength: 0.05
        final_gene_mask_rate: 0.0
        final_mask_activation_threshold: 0.0
        final_sensitivity_p: 0.25
        final_sparsity_modulator_strength: 0.1
        gene_jitter_prob: 0.6
        gene_mask_prob: 0.5
        gvf_lower_p: 0.1
        gvf_upper_p: 0.95
        initial_cov_influence_weight: 1.5
        initial_gene_jitter_strength: 0.2
        initial_gene_mask_rate: 0.05
        initial_mask_activation_threshold: 0.5
        initial_sensitivity_p: 2.0
        initial_sparsity_modulator_strength: 0.75
        max_effective_mask_rate: 0.25
        sensitivity_p_phase1_epochs_ratio: 0.25

    adversarial:
      adv_loss: false
      perc_loss: false
      feature_extractor_checkpoint: null
      adv_mode: frozen
      perc_mode: frozen
      lambda_adv: 0.1
      lambda_perc: 0.1
      disc_lr: 0.0002

    eval:
      decoder_eval_freq: 25
      bmdb_eval_freq: 3
      run_encoder_benchmark: false
      log_interval: 3
      cell_eval_enabled: true
      eval_data:
        - ${paths.eval_dir}/nadig_2024_jurkat.h5ad

      # ⚠️ REQUIRED for this arm, and the reason the released checkpoint's own
      #    epoch-185 selection is untrustworthy.
      #
      # `combined_score` -- which picks best_decoder.pth -- includes Spearman
      # over zero-filled padding genes. For any head that does not emit exact
      # zeros, that term collapses as a monotone function of the zero-fill
      # fraction: TREK at 1.4% padding loses 0.69 Spearman, nadig at 80.2%
      # loses 90.46, while Pearson and MAE barely move. Scoring present genes
      # only removes the artifact.
      eval_present_genes_only: true

      # Selection metric. Do NOT rank on overlap_at_N: a zero-signal predictor
      # beat the real model on it (TREK 0.3360 vs 0.2030) with chance-level
      # discrimination.
      select_on: pearson_delta
