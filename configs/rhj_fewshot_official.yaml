# Published all-source RHJ recipe (ABL_N_ALL), verified against all five released configurations.
version: 1
name: rhj_fewshot
seed: 42
device: cuda
paths:
  eval_dir: data/eval/pert
  scib_dir: data/eval/scib
  train_corpus: data/corpus/diverserna.h5ad
  kg_graph_dir: data/graphs
  bmdb_dir: ''
run:
  root: ./runs
  stages:
  - vcell
  runner: inprocess
  resume: auto
  wandb:
    enabled: false
    project: occam
    tags:
    - occam
    - rhj_fewshot
    - vcell
data:
  train: ${paths.eval_dir}/nadig_2024_hepg2.h5ad
stages:
  vcell:
    init_from: checkpoints/release/occam_small_encoder_decoder.pth
    benchmark:
      dir: data/benchmarks/rhj_fewshot
      id: rhj_fewshot
      sha256: d934211e5eb1e37e28c893fb8c5ff4211d607a1d77b0103d5c2b79221d21677f
      axis_scope: input_and_loss
      eval_cell_lines:
      - HEPG2
      build_test_datasets: false
    data:
      paths:
      - ${paths.eval_dir}/nadig_2024_hepg2.h5ad
      - ${paths.eval_dir}/nadig_2024_jurkat.h5ad
      - ${paths.eval_dir}/replogle_2022_rpe1_e.h5ad
      gene_col: ensembl_gene_id
      pert_col: gene_name
      batch_col: dataset_batch_num
      target_sum: 2000.0
      n_controls_per_sample: 1
      include_controls_as_training: true
    stream:
      stream_v2: true
      interleave: proportional
      balance_sources: true
      fixed_pairs: false
      chunk_size: 4096
      buffer_chunks: 4
      num_workers: 8
      control_cache_dir: null
      amp_dtype: bf16
      target_pb_k: 1
      ctrl_avg_k: 1
    encoder:
      freeze_encoder: true
      freeze_decoder: false
    graph:
      graph_type: go
      graph_types:
      - go
      - string
      graph_edge_filter_mode: top_20
      pert_model_type: adjacency_map
      no_gnn: false
      master_gene_set_path: ${paths.kg_graph_dir}/master_gene_set_sorted.csv
      graph_cache_dir: ${paths.kg_graph_dir}
      gnn_layer_type: gat_v2
      gnn_num_layers: 4
      pert_latent_dim: 128
      graph_reduce2perts: true
      data_perts_only: false
      adj_hidden_dim: 128
      adj_dropout: 0.2
      adj_deg: 1
      adj_normalize: none
      adj_self_loops: false
      adj_only_reverse: true
      adj_make_undirected: true
      adj_use_ffn: true
      adj_activation: relu
      pert_embedding_path: ''
      pert_embedding_norm: zscore
      pert_embedding_paths:
      - data/assets/genept_full_occam_rhj_fewshot.pkl
      - data/assets/esm2_t33_650M_UR50D_occam_rhj_fewshot.pkl
    interaction:
      interaction_type: film
      film_mode: multiplicative_only
      film_scale: 1.0
      film_hidden_dim: 256
      film_activation: none
      film_mean_free: true
    optim:
      lr: 0.001
      decoder_lr: 0.001
      epochs: 180
      warmup_epochs: 5
      batch_size: 2048
      gradient_clip: 1.0
      eta_min: 0.0007
      save_every_epochs: 0
    loss:
      loss_type: smooth_l1
      smooth_l1_beta: 2.0
      cosine_loss_weight: 0.0
      source_weight: none
      loss_norm: pooled
      delta_mag_weight: 0.0
      latent_loss_type: none
      latent_loss_weight: 0.0
      latent_loss_alpha: 0.5
      latent_cos_weight: 0.0
      latent_cos_target: delta_z
      vicreg_var_weight: 0.0
      vicreg_cov_weight: 0.0
      vicreg_gamma: 0.0
      vicreg_target: delta_z
      recon_split: false
      recon_split_mode: cmean
      recon_delta_target: cell
      recon_ctrl_weight: 1.0
      recon_delta_weight: 1.0
      delta_cos_weight: 0.5
      dcos_conc_weight: 0.0
      radial_spread_weight: 0.0
      gene_var_weight: 0.0
      disp_ema_momentum: 0.99
      nb_weight: 0.0
      nb_scale: 1.0
      vc_load_dispersion: true
    guards:
      bench_batches: 0
      nan_guard_max_frac: 0.1
      weight_check_every: 500
    eval:
      eval_freq: 1
      run_baselines: false
